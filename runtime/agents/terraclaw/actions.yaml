# Atomic action definitions for the NPC agent.
# Each action maps to a bridge action_type and is exposed as an LLM tool.
# Set enabled: false to hide the tool from the LLM without deleting the definition.

move_to:
  description: "Move the NPC toward world coordinates. The NPC can fly through walls."
  enabled: true
  parameters:
    type: object
    properties:
      x:
        type: number
        description: "Target world X coordinate (pixels)"
      y:
        type: number
        description: "Target world Y coordinate (pixels)"
      speed:
        type: number
        description: "Movement speed in pixels/tick"
        default: 4.0
      arrival_radius:
        type: number
        description: "Distance at which arrival is confirmed"
        default: 16.0
    required: [x, y]
  bridge_action: move_to

teleport:
  description: "Instantly teleport the NPC to world coordinates."
  enabled: true
  parameters:
    type: object
    properties:
      x:
        type: number
        description: "Target world X coordinate (pixels)"
      y:
        type: number
        description: "Target world Y coordinate (pixels)"
    required: [x, y]
  bridge_action: teleport

break_tile:
  description: "Break/destroy a tile at the specified tile coordinates."
  enabled: true
  parameters:
    type: object
    properties:
      tx:
        type: integer
        description: "Tile X coordinate (see Notable tiles nearby for candidates)"
      ty:
        type: integer
        description: "Tile Y coordinate"
    required: [tx, ty]
  bridge_action: break_tile

break_wall:
  description: "Break/destroy a wall at the specified tile coordinates."
  enabled: true
  parameters:
    type: object
    properties:
      tx:
        type: integer
        description: "Tile X coordinate"
      ty:
        type: integer
        description: "Tile Y coordinate"
    required: [tx, ty]
  bridge_action: break_wall

place_tile:
  description: "Place a tile at the specified tile coordinates."
  enabled: true
  parameters:
    type: object
    properties:
      tx:
        type: integer
        description: "Tile X coordinate"
      ty:
        type: integer
        description: "Tile Y coordinate"
      tile_type:
        type: integer
        description: "Tile type ID (e.g. 0=dirt, 1=stone, 2=grass, 9=sand, 53=wood)"
        default: 0
      style:
        type: integer
        description: "Tile style variant"
        default: 0
    required: [tx, ty]
  bridge_action: place_tile

place_wall:
  description: "Place a wall at the specified tile coordinates."
  enabled: true
  parameters:
    type: object
    properties:
      tx:
        type: integer
        description: "Tile X coordinate"
      ty:
        type: integer
        description: "Tile Y coordinate"
      wall_type:
        type: integer
        description: "Wall type ID"
        default: 0
    required: [tx, ty]
  bridge_action: place_wall

wait:
  description: "Wait / idle for a duration."
  enabled: true
  parameters:
    type: object
    properties:
      duration_ms:
        type: integer
        description: "Duration in milliseconds"
        minimum: 0
        maximum: 60000
        default: 1000
  bridge_action: wait

get_action_status:
  description: "Check the status of a previously started action by its action_id. Returns the result if completed, or 'running' if still in progress."
  enabled: true
  parameters:
    type: object
    properties:
      action_id:
        type: string
        description: "The action_id returned when the action was started"
    required: [action_id]
  bridge_action: get_action_status

talk:
  description: "Make the NPC say something — prints a chat message and shows floating text above the NPC's head."
  enabled: true
  parameters:
    type: object
    properties:
      text:
        type: string
        maxLength: 80
        description: "The text message for the NPC to say (max 80 characters)"
    required: [text]
  bridge_action: talk

cancel_action:
  description: "Cancel or interrupt a running action by its action_id."
  enabled: true
  parameters:
    type: object
    properties:
      action_id:
        type: string
        description: "The action_id to cancel"
    required: [action_id]
  bridge_action: cancel_action

scan_area:
  description: "Perform a one-time wide-radius scan of the surrounding area. Temporarily increases the observation radius for the next observation cycle, allowing the agent to see farther than normal. The observation data will arrive in the next observation message as usual."
  enabled: true
  parameters:
    type: object
    properties:
      radius:
        type: integer
        description: "Scan radius in tiles (larger = wider area but more data)"
        minimum: 1
        maximum: 200
        default: 40
    required: []
  bridge_action: scan_area
