<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TerraClaw LLM Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #1a1b26; color: #c0caf5;
  height: 100vh; display: flex; flex-direction: column;
}
header {
  padding: 12px 20px; background: #1f2335; border-bottom: 1px solid #2f3345;
  display: flex; align-items: center; gap: 16px; flex-shrink: 0;
}
header h1 { font-size: 16px; font-weight: 600; color: #7aa2f7; }
.status { font-size: 12px; padding: 3px 10px; border-radius: 10px; }
.connected { background: #1b3b2b; color: #9ece6a; }
.disconnected { background: #3b1b1b; color: #f7768e; }
#turn-counter { font-size: 12px; color: #565f89; margin-left: auto; }
#main {
  flex: 1; overflow-y: auto; padding: 16px 20px;
  display: flex; flex-direction: column; gap: 12px;
}
.turn {
  background: #1f2335; border: 1px solid #2f3345; border-radius: 10px;
  padding: 16px; animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.turn-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px; font-size: 12px; color: #565f89;
}
.turn-num { font-weight: 600; color: #7aa2f7; }
.turn-text {
  background: #14161f; border-radius: 8px; padding: 12px;
  font-size: 14px; line-height: 1.6; white-space: pre-wrap;
  margin-bottom: 10px; border-left: 3px solid #7aa2f7;
}
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.tool-call {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 6px; font-size: 13px;
}
.tool-call.running { background: #1a2b4a; color: #7dcfff; border: 1px solid #2f4f7a; }
.tool-call.done { background: #1b3b2b; color: #9ece6a; border: 1px solid #2f5f3a; }
.tool-call.failed { background: #3b1b1b; color: #f7768e; border: 1px solid #5f2f2f; }
.tool-args {
  font-size: 11px; color: #565f89; margin-left: 4px;
  max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tool-detail {
  font-size: 11px; color: #565f89; margin-top: 2px;
  max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.instruction-badge {
  display: inline-block; background: #2a1f3b; color: #bb9af7;
  padding: 3px 8px; border-radius: 6px; font-size: 12px; margin-bottom: 8px;
}
.instruction-badge::before { content: "📋 "; }
.player-said {
  background: #1a1b2e; border: 1px solid #3a2f5a; border-radius: 8px;
  padding: 8px 12px; margin-bottom: 10px; font-size: 13px; color: #bb9af7;
}
.player-said::before { content: "Player: "; font-weight: 600; color: #7aa2f7; }
.request-meta {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 8px; margin-bottom: 10px; font-size: 12px; color: #9aa5ce;
}
.meta-box { background: #14161f; border: 1px solid #2f3345; border-radius: 6px; padding: 8px; }
.json-block {
  background: #10121a; border: 1px solid #2f3345; border-radius: 8px;
  padding: 10px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 12px; line-height: 1.45; color: #a9b1d6; white-space: pre-wrap;
  overflow-x: auto; margin-top: 8px;
}
.result-ok { border-left: 3px solid #9ece6a; }
.result-failed { border-left: 3px solid #f7768e; }
.pill {
  display: inline-block; padding: 2px 7px; border-radius: 999px;
  background: #26344f; color: #7dcfff; font-size: 11px; margin-right: 6px;
}
#empty-msg {
  text-align: center; padding: 60px 20px; color: #565f89;
}
#empty-msg h2 { font-size: 20px; margin-bottom: 8px; color: #3b4261; }
#empty-msg p { font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>TerraClaw · LLM Dashboard</h1>
  <span class="status disconnected" id="status">Disconnected</span>
  <span id="turn-counter">Turns: 0</span>
</header>
<div id="main">
  <div id="empty-msg">
    <h2>Waiting for LLM activity…</h2>
    <p>Connect the runtime and the dashboard will update in real-time.</p>
  </div>
</div>

<script>
const wsUrl = `ws://${location.host}/ws`;
let ws;
let turnCount = 0;

function connect() {
  ws = new WebSocket(wsUrl);
  ws.onopen = () => {
    document.getElementById('status').textContent = 'Connected';
    document.getElementById('status').className = 'status connected';
  };
  ws.onclose = () => {
    document.getElementById('status').textContent = 'Disconnected';
    document.getElementById('status').className = 'status disconnected';
    setTimeout(connect, 2000);
  };
  ws.onmessage = (e) => {
    try { handleMessage(JSON.parse(e.data)); } catch (err) {}
  };
}

function handleMessage(msg) {
  const { type, data } = msg;
  switch (type) {
    case 'hello':
      turnCount = data.turn || 0;
      updateCounter();
      break;
    case 'llm_call':
      startTurn(data);
      break;
    case 'llm_response':
      endTurn(data);
      break;
    case 'tool_result':
      updateTool(data);
      break;
    case 'player_instruction':
      addInstruction(data);
      break;
    case 'llm_request':
      addLlmRequest(data);
      break;
    case 'llm_result':
      addLlmResult(data);
      break;
  }
}

let currentTurnEl = null;
let currentToolEls = {};

function startTurn(data) {
  removeEmptyMsg();
  const el = document.createElement('div');
  el.className = 'turn';
  el.dataset.turn = data.turn;
  el.innerHTML = `
    <div class="turn-header">
      <span class="turn-num">Turn #${data.turn}</span>
      <span>${data.tick ? 'tick ' + data.tick : ''}</span>
    </div>
    <div class="tools" id="tools-${data.turn}"><span style="color:#565f89;font-size:13px;">Calling LLM…</span></div>
  `;
  document.getElementById('main').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
  currentTurnEl = el;
  currentToolEls = {};
}

function endTurn(data) {
  if (!currentTurnEl) return;
  const turn = currentTurnEl.dataset.turn;
  // Insert LLM text
  const textDiv = document.createElement('div');
  textDiv.className = 'turn-text';
  textDiv.textContent = data.text || '(empty response)';
  currentTurnEl.insertBefore(textDiv, currentTurnEl.querySelector('.tools'));

  // Add tool calls to the tools container
  const toolsContainer = document.getElementById(`tools-${turn}`);
  toolsContainer.innerHTML = '';
  if (data.tool_calls && data.tool_calls.length > 0) {
    for (const tc of data.tool_calls) {
      const badge = document.createElement('span');
      badge.className = 'tool-call running';
      badge.id = `tc-${turn}-${tc.name}`;
      const argsStr = tc.arguments ? JSON.stringify(tc.arguments) : '';
      badge.innerHTML = `⚡ ${tc.name} <span class="tool-args">${escapeHtml(argsStr)}</span>`;
      toolsContainer.appendChild(badge);
      currentToolEls[tc.name] = badge;
    }
  } else {
    toolsContainer.innerHTML = '<span style="color:#565f89;font-size:12px;">(no tool calls — reasoning only)</span>';
  }

  turnCount = Math.max(turnCount, parseInt(turn));
  updateCounter();
}

function updateTool(data) {
  const turn = currentTurnEl ? currentTurnEl.dataset.turn : null;
  const badgeId = `tc-${turn}-${data.tool}`;
  const badge = document.getElementById(badgeId) || currentToolEls[data.tool];
  if (!badge) return;
  const status = data.result ? (data.result.status || 'done') : 'done';
  const err = data.result ? data.result.error : null;
  badge.className = `tool-call ${err ? 'failed' : 'done'}`;
  const icon = err ? '✗' : '✓';
  badge.innerHTML = `${icon} ${data.tool}`;
  if (status === 'started') {
    badge.innerHTML = `⚡ ${data.tool} <span class="tool-detail">started</span>`;
    badge.className = 'tool-call running';
  } else if (err) {
    badge.innerHTML = `✗ ${data.tool} <span class="tool-detail">${escapeHtml(String(err).slice(0, 60))}</span>`;
  } else {
    badge.innerHTML = `✓ ${data.tool}`;
  }
}

function addInstruction(data) {
  removeEmptyMsg();
  const el = document.createElement('div');
  el.className = 'turn';
  el.innerHTML = `
    <div class="turn-header">
      <span class="instruction-badge">Player Instruction</span>
      <span>${new Date().toLocaleTimeString()}</span>
    </div>
    <div class="player-said">${escapeHtml(data.text)}</div>
  `;
  document.getElementById('main').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function addLlmRequest(data) {
  removeEmptyMsg();
  const el = document.createElement('div');
  el.className = 'turn';
  el.id = `req-${data.request_id}`;
  const obsKeys = (data.observation_keys || []).map(k => `<span class="pill">${escapeHtml(k)}</span>`).join('');
  el.innerHTML = `
    <div class="turn-header">
      <span class="turn-num">LLM Request${data.turn ? ' #' + data.turn : ''}</span>
      <span>${new Date().toLocaleTimeString()}</span>
    </div>
    <div class="request-meta">
      <div class="meta-box"><b>request</b><br>${escapeHtml(shortId(data.request_id))}</div>
      <div class="meta-box"><b>agent</b><br>${escapeHtml(shortId(data.agent_id))}</div>
      <div class="meta-box"><b>timeout</b><br>${data.timeout_ms || 0} ms</div>
    </div>
    <div class="turn-text">${escapeHtml(data.instruction || '(no instruction)')}</div>
    <div style="margin-bottom:8px;">${obsKeys}</div>
    <details>
      <summary style="cursor:pointer;color:#7aa2f7;font-size:13px;">Flat Symbolic Observation</summary>
      <div class="json-block">${escapeHtml(pretty(data.symbolic_observation))}</div>
    </details>
    <details>
      <summary style="cursor:pointer;color:#7aa2f7;font-size:13px;">Observation</summary>
      <div class="json-block">${escapeHtml(pretty(data.observation))}</div>
    </details>
    <details>
      <summary style="cursor:pointer;color:#7aa2f7;font-size:13px;margin-top:8px;">Flat Output Contract</summary>
      <div class="json-block">${escapeHtml(pretty(data.output_contract && data.output_contract.flat))}</div>
    </details>
    <details>
      <summary style="cursor:pointer;color:#7aa2f7;font-size:13px;margin-top:8px;">Output Contract</summary>
      <div class="json-block">${escapeHtml(pretty(data.output_contract))}</div>
    </details>
  `;
  document.getElementById('main').appendChild(el);
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function addLlmResult(data) {
  removeEmptyMsg();
  const existing = document.getElementById(`req-${data.request_id}`);
  const el = document.createElement('div');
  const failed = data.status !== 'completed';
  el.className = `turn ${failed ? 'result-failed' : 'result-ok'}`;
  el.innerHTML = `
    <div class="turn-header">
      <span class="turn-num">LLM ${escapeHtml(data.status || 'result')}</span>
      <span>${data.duration_s ? data.duration_s + 's' : new Date().toLocaleTimeString()}</span>
    </div>
    <div class="request-meta">
      <div class="meta-box"><b>request</b><br>${escapeHtml(shortId(data.request_id))}</div>
      <div class="meta-box"><b>agent</b><br>${escapeHtml(shortId(data.agent_id))}</div>
    </div>
    ${failed
      ? `<div class="turn-text">${escapeHtml(data.error || 'Unknown error')}</div>`
      : `<div class="json-block">${escapeHtml(pretty(data.output))}</div>`}
  `;
  if (existing && existing.nextSibling) {
    document.getElementById('main').insertBefore(el, existing.nextSibling);
  } else {
    document.getElementById('main').appendChild(el);
  }
  el.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function removeEmptyMsg() {
  const empty = document.getElementById('empty-msg');
  if (empty) empty.remove();
}

function updateCounter() {
  document.getElementById('turn-counter').textContent = `Turns: ${turnCount}`;
}

function escapeHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function pretty(value) {
  try { return JSON.stringify(value, null, 2); } catch (_) { return String(value || ''); }
}

function shortId(value) {
  if (!value) return '';
  return String(value).slice(0, 8) + '…';
}

connect();
</script>
</body>
</html>
