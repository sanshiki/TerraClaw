[project]
name = "terraclaw-runtime"
version = "0.1.0"
description = "Embodied AI runtime for Terraria — LLM agent bridge"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sanshiki" }]

dependencies = [
    "websockets>=13.0",
    "anthropic>=0.39.0",
    "openai>=1.60.0",
    "structlog>=24.4.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23.0",
    "chromadb>=0.5.0",
    "pydantic>=2.9.0",
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "lupa>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"
lint.select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
